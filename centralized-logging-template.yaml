AWSTemplateFormatVersion: '2010-09-09'
Description: 'Centralized Logging Solution for Sirius CTS - Captures user activity events and forwards them to Shared Services Account'

Parameters:
  SharedServicesAccountId:
    Type: String
    Description: AWS Account ID of the Sirius CTS Shared Services Account
    AllowedPattern: '^[0-9]{12}$'
    ConstraintDescription: Must be a valid 12-digit AWS account ID
  
  SharedServicesRegion:
    Type: String
    Description: AWS Region of the Sirius CTS Shared Services Account
    Default: us-east-1
  
  CloudTrailBucketName:
    Type: String
    Description: Name of the S3 bucket to store CloudTrail logs
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid S3 bucket name

  EventBusName:
    Type: String
    Description: Name of the EventBridge event bus in the Shared Services Account
    Default: sirius-cts-central-event-bus

Resources:
  # S3 Bucket for CloudTrail Logs
  CloudTrailLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref CloudTrailBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacierAndExpire
            Status: Enabled
            ExpirationInDays: 2555  # ~7 years
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER

  # S3 Bucket Policy for CloudTrail
  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub 'arn:aws:s3:::${CloudTrailLogBucket}'
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub 'arn:aws:s3:::${CloudTrailLogBucket}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  # CloudTrail Trail
  CloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - CloudTrailBucketPolicy
    Properties:
      S3BucketName: !Ref CloudTrailLogBucket
      IsLogging: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      EventSelectors:
        - ReadWriteType: WriteOnly  # Focus on create, delete, and modify actions
          IncludeManagementEvents: true
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogsRole.Arn

  # CloudWatch Log Group for CloudTrail
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/cloudtrail/activity-logs
      RetentionInDays: 90

  # IAM Role for CloudTrail to CloudWatch Logs
  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # AWS Config Recorder
  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      Name: default
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true
      RoleARN: !GetAtt ConfigRole.Arn

  # AWS Config Delivery Channel
  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Properties:
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: Six_Hours
      S3BucketName: !Ref CloudTrailLogBucket
      S3KeyPrefix: config

  # IAM Role for AWS Config
  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWS_ConfigRole
      Policies:
        - PolicyName: ConfigBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${CloudTrailLogBucket}/config/AWSLogs/${AWS::AccountId}/*'
                Condition:
                  StringLike:
                    s3:x-amz-acl: bucket-owner-full-control
              - Effect: Allow
                Action:
                  - s3:GetBucketAcl
                Resource: !Sub 'arn:aws:s3:::${CloudTrailLogBucket}'

  # IAM Role for EventBridge to send events to the central account
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsToSharedServicesAccount
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub 'arn:aws:events:${SharedServicesRegion}:${SharedServicesAccountId}:event-bus/${EventBusName}'

  # EventBridge Rule for CloudTrail Create Events
  CloudTrailCreateEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CloudTrailCreateEvents
      Description: "Captures create events from CloudTrail and forwards to Shared Services Account"
      EventPattern:
        source:
          - aws.cloudtrail
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventName:
            - prefix: "Create"
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:events:${SharedServicesRegion}:${SharedServicesAccountId}:event-bus/${EventBusName}'
          Id: SharedServicesTarget
          RoleArn: !GetAtt EventBridgeRole.Arn

  # EventBridge Rule for CloudTrail Delete Events
  CloudTrailDeleteEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CloudTrailDeleteEvents
      Description: "Captures delete events from CloudTrail and forwards to Shared Services Account"
      EventPattern:
        source:
          - aws.cloudtrail
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventName:
            - prefix: "Delete"
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:events:${SharedServicesRegion}:${SharedServicesAccountId}:event-bus/${EventBusName}'
          Id: SharedServicesTarget
          RoleArn: !GetAtt EventBridgeRole.Arn

  # EventBridge Rule for CloudTrail Modify Events
  CloudTrailModifyEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CloudTrailModifyEvents
      Description: "Captures modify events from CloudTrail and forwards to Shared Services Account"
      EventPattern:
        source:
          - aws.cloudtrail
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventName:
            - prefix: "Update"
            - prefix: "Modify"
            - prefix: "Put"
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:events:${SharedServicesRegion}:${SharedServicesAccountId}:event-bus/${EventBusName}'
          Id: SharedServicesTarget
          RoleArn: !GetAtt EventBridgeRole.Arn

  # EventBridge Rule for AWS Config Configuration Changes
  ConfigChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ConfigConfigurationChanges
      Description: "Captures configuration changes from AWS Config and forwards to Shared Services Account"
      EventPattern:
        source:
          - aws.config
        detail-type:
          - "Config Configuration Item Change"
      State: ENABLED
      Targets:
        - Arn: !Sub 'arn:aws:events:${SharedServicesRegion}:${SharedServicesAccountId}:event-bus/${EventBusName}'
          Id: SharedServicesTarget
          RoleArn: !GetAtt EventBridgeRole.Arn

Outputs:
  CloudTrailLogBucketName:
    Description: Name of the S3 bucket storing CloudTrail logs
    Value: !Ref CloudTrailLogBucket
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailBucket"

  CloudTrailLogGroupName:
    Description: Name of the CloudWatch Logs group for CloudTrail
    Value: !Ref CloudTrailLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailLogGroup"

  ConfigRecorderName:
    Description: Name of the AWS Config Recorder
    Value: !Ref ConfigRecorder
    Export:
      Name: !Sub "${AWS::StackName}-ConfigRecorder"

  EventBridgeRoleArn:
    Description: ARN of the IAM Role used by EventBridge to send events to Shared Services Account
    Value: !GetAtt EventBridgeRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRoleArn"